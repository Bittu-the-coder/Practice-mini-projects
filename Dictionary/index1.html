<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dictionary App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(5deg);
        }
      }
      .float-animation {
        animation: float 5s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 10px rgba(147, 51, 234, 0.5);
        }
        50% {
          box-shadow: 0 0 20px rgba(147, 51, 234, 0.9);
        }
      }
      .glow-effect:hover {
        animation: pulse-glow 1.5s infinite;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      .triangle {
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-bottom: 35px solid rgba(147, 51, 234, 0.2);
        position: absolute;
        animation: float 6s ease-in-out infinite;
      }
      #result {
        max-height: 50vh;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(147, 51, 234, 0.5) rgba(31, 41, 55, 0.8);
      }
      #result::-webkit-scrollbar {
        width: 8px;
      }
      #result::-webkit-scrollbar-thumb {
        background-color: rgba(147, 51, 234, 0.5);
        border-radius: 4px;
      }
      #result::-webkit-scrollbar-track {
        background-color: rgba(31, 41, 55, 0.8);
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-gray-900 via-indigo-900 to-purple-900 min-h-screen flex flex-col items-center justify-between p-4 md:p-6 relative overflow-hidden text-white"
  >
    <!-- Background Effects -->
    <div
      class="absolute top-10 left-10 w-16 h-16 bg-gradient-to-r from-purple-500 to-indigo-500 opacity-20 rounded-full blur-2xl float-animation md:w-20 md:h-20"
    ></div>
    <div
      class="absolute bottom-10 right-10 w-20 h-20 bg-gradient-to-r from-pink-500 to-purple-500 opacity-20 rounded-full blur-2xl float-animation delay-1000 md:w-24 md:h-24"
    ></div>
    <div class="triangle top-20 right-20 opacity-30 blur-sm md:right-40"></div>
    <div class="triangle bottom-20 left-20 opacity-20 blur-sm"></div>

    <!-- Header -->
    <header class="w-full max-w-2xl">
      <nav
        class="bg-gray-800/80 p-4 md:p-6 rounded-xl shadow-lg backdrop-blur-sm transform hover:scale-105 transition-all duration-300"
      >
        <h1
          class="text-xl md:text-2xl font-bold text-center bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent"
        >
          Dictionary App
        </h1>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center w-full max-w-2xl">
      <div class="w-full space-y-6">
        <form id="searchForm" class="flex flex-col sm:flex-row gap-4">
          <input
            id="wordInput"
            type="text"
            placeholder="Enter a word (e.g., 'hope')"
            class="flex-grow p-3 md:p-4 bg-gray-700 text-white border border-purple-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400 focus:scale-105 transition-all duration-300 text-sm md:text-base"
          />
          <button
            type="submit"
            class="bg-gradient-to-br from-purple-600 to-indigo-600 p-3 md:p-4 rounded-lg text-sm md:text-base font-semibold hover:scale-110 hover:shadow-lg glow-effect transition-all duration-300 flex items-center justify-center gap-2"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
            Search
          </button>
        </form>
        <div
          id="result"
          class="bg-gray-800/80 p-4 md:p-6 rounded-xl shadow-lg backdrop-blur-sm text-gray-300 text-sm md:text-base fade-in"
        ></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-2xl text-center py-4 border-t border-gray-800">
      <p class="text-gray-400 text-xs md:text-sm">
        © Educationyan, India's Learning Platform
      </p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
      const searchForm = document.getElementById("searchForm");
      const wordInput = document.getElementById("wordInput");
      const resultDiv = document.getElementById("result");

      // Initial sample result
      resultDiv.innerHTML = `
        <h2 class="text-lg md:text-xl font-semibold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">welcome</h2>
        <p class="italic text-gray-400">/ˈwel.kəm/</p>
        <h3 class="mt-4 font-semibold text-purple-400">noun</h3>
        <p>1. A greeting or reception.</p>
        <p class="text-gray-500 italic">Example: The host gave us a warm welcome.</p>
        <h3 class="mt-4 font-semibold text-purple-400">verb</h3>
        <p>1. To greet someone in a glad or friendly way.</p>
        <p class="text-gray-500 italic">Example: They welcomed us into their home.</p>
      `;

      searchForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const word = wordInput.value.trim();
        if (!word) {
          resultDiv.innerHTML =
            '<p class="text-red-400 fade-in">Please enter a word!</p>';
          return;
        }

        resultDiv.innerHTML = '<p class="fade-in">Searching...</p>';
        resultDiv.classList.remove("fade-in"); // Reset animation
        void resultDiv.offsetWidth; // Trigger reflow
        resultDiv.classList.add("fade-in");

        try {
          const response = await fetch(
            `https://api.dictionaryapi.dev/api/v2/entries/en/${word}`
          );
          if (!response.ok) throw new Error("Word not found");
          const data = await response.json();
          displayResult(data[0]);
        } catch (error) {
          resultDiv.innerHTML = `<p class="text-red-400 fade-in">Error: ${
            error.message || "Something went wrong"
          }</p>`;
        }
      });

      function displayResult(entry) {
        const { word, phonetics, meanings } = entry;
        let html = `<h2 class="text-lg md:text-xl font-semibold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">${word}</h2>`;

        // Phonetics with audio (if available)
        const phonetic = phonetics.find((p) => p.text) || {};
        if (phonetic.text) {
          html += `<p class="italic text-gray-400 flex items-center gap-2">${phonetic.text}`;
          if (phonetic.audio) {
            html += `<button onclick="playAudio('${phonetic.audio}')" class="text-purple-400 hover:text-purple-300 transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7V5z"></path>
              </svg>
            </button>`;
          }
          html += `</p>`;
        }

        // Meanings
        meanings.forEach((meaning, index) => {
          html += `<h3 class="mt-4 font-semibold text-purple-400">${meaning.partOfSpeech}</h3>`;
          meaning.definitions.slice(0, 3).forEach((def, i) => {
            html += `<p>${i + 1}. ${def.definition}</p>`;
            if (def.example) {
              html += `<p class="text-gray-500 italic">Example: ${def.example}</p>`;
            }
          });
        });

        resultDiv.innerHTML = html;
        resultDiv.classList.remove("fade-in");
        void resultDiv.offsetWidth;
        resultDiv.classList.add("fade-in");
      }

      function playAudio(audioUrl) {
        const audio = new Audio(audioUrl);
        audio.play().catch((err) => console.log("Audio playback failed:", err));
      }

      // Clear result on empty input
      wordInput.addEventListener("input", () => {
        if (!wordInput.value) {
          resultDiv.innerHTML =
            '<p class="text-gray-400 fade-in">Start typing to search...</p>';
        }
      });
    </script>
  </body>
</html>
