<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 0 15px rgba(147, 51, 234, 0.5);
        }
        50% {
          box-shadow: 0 0 30px rgba(147, 51, 234, 0.9);
        }
      }
      .glow-effect:hover {
        animation: pulse-glow 1.5s infinite;
      }

      #chat-container {
        height: 400px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #6366f1 #1f2937;
      }

      #chat-container::-webkit-scrollbar {
        width: 6px;
      }

      #chat-container::-webkit-scrollbar-track {
        background: #1f2937;
      }

      #chat-container::-webkit-scrollbar-thumb {
        background-color: #6366f1;
        border-radius: 10px;
      }

      .user-message {
        background: linear-gradient(to right, #6366f1, #8b5cf6);
      }

      .bot-message {
        background: linear-gradient(to right, #3b82f6, #6366f1);
      }

      .chat-bubble {
        max-width: 80%;
        word-wrap: break-word;
      }

      .floating-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 100;
        transition: all 0.3s ease;
      }

      .floating-button:hover {
        transform: scale(1.1);
      }

      .chat-window {
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 350px;
        z-index: 100;
        transition: all 0.3s ease;
        opacity: 0;
        transform: translateY(20px);
        pointer-events: none;
      }

      .chat-window.active {
        opacity: 1;
        transform: translateY(0);
        pointer-events: all;
      }

      @media (max-width: 640px) {
        .chat-window {
          width: calc(100% - 40px);
          bottom: 80px;
          right: 20px;
        }
      }

      .typing-indicator {
        display: inline-flex;
        align-items: center;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: white;
        margin: 0 2px;
        animation: typing-dot 1.4s infinite ease-in-out;
      }

      .typing-dot:nth-child(1) {
        animation-delay: 0s;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing-dot {
        0%,
        80%,
        100% {
          transform: scale(0.8);
          opacity: 0.6;
        }
        40% {
          transform: scale(1.2);
          opacity: 1;
        }
      }

      /* For formatting Gemini markdown responses */
      .bot-message p {
        margin: 8px 0;
      }
      .bot-message strong {
        font-weight: bold;
      }
      .bot-message code {
        background-color: rgba(0, 0, 0, 0.2);
        padding: 2px 4px;
        border-radius: 4px;
        font-family: monospace;
      }
      .bot-message ul {
        margin-left: 20px;
        list-style-type: disc;
      }
    </style>
  </head>
  <body>
    <!-- Chatbot Button -->
    <div class="floating-button" id="chat-button">
      <button
        class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-4 rounded-full shadow-lg glow-effect"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"
          />
        </svg>
      </button>
    </div>

    <!-- Chat Window -->
    <div class="chat-window bg-gray-900 rounded-xl shadow-2xl" id="chat-window">
      <!-- Chat Header -->
      <div
        class="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-t-xl p-4 flex justify-between items-center"
      >
        <div class="flex items-center gap-3">
          <div class="bg-white p-2 rounded-full">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 text-indigo-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15.3M14.25 3.104c.251.023.501.05.75.082M19.8 15.3l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23.693L5 14.5m14.8.8l1.402 1.402c1.232 1.232.65 3.318-1.067 3.611A48.309 48.309 0 0112 21a48.25 48.25 0 01-8.135-.687c-1.718-.293-2.3-2.379-1.067-3.61L5 14.5"
              />
            </svg>
          </div>
          <h3 class="text-white font-bold">Gemini Assistant</h3>
        </div>
        <button
          id="close-chat"
          class="text-white hover:text-gray-200 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Chat Messages -->
      <div id="chat-container" class="p-4 bg-gray-800">
        <div
          class="bot-message chat-bubble rounded-lg p-3 mb-4 text-white shadow-md"
        >
          <p>
            Hello! I'm Gemini, your Mini Projects Hub assistant. How can I help
            you today?
          </p>
        </div>
        <!-- Messages will be added here -->
      </div>

      <!-- Chat Input -->
      <div class="p-4 border-t border-gray-700 bg-gray-800 rounded-b-xl">
        <form id="chat-form" class="flex gap-2">
          <input
            type="text"
            id="user-input"
            class="flex-1 bg-gray-700 text-white p-2 rounded-lg border border-gray-600 focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="Type your message..."
          />
          <button
            type="submit"
            class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-2 rounded-lg hover:from-purple-700 hover:to-indigo-700 transition-all duration-300"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
              />
            </svg>
          </button>
        </form>
      </div>
    </div>

    <script type="module">
      import { GoogleGenerativeAI } from "https://cdn.jsdelivr.net/npm/@google/generative-ai@0.2.1/+esm";

      // Initialize Gemini - use your API key here
      const API_KEY = ""; 
      const genAI = new GoogleGenerativeAI(API_KEY);
      const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash" });

      // Chat history for context
      let chatHistory = [];

      // System prompt
      const systemPrompt = `
      You are a friendly and knowledgeable assistant for Mini Projects Hub.  
      You can answer questions about:
      - Projects available on Mini Projects Hub
      - How to use different projects
      - Coding techniques and best practices
      - Help with implementing features
      - General coding questions  

      Format responses using Markdown-like syntax:  
      - Use **bold** for important terms  
      - Use \`code\` for short code snippets  
      - Use - for bullet points  
      - Use \n for new lines  
      - Include emojis when relevant  
      `;

      // Toggle chat window
      const chatButton = document.getElementById("chat-button");
      const chatWindow = document.getElementById("chat-window");
      const closeChat = document.getElementById("close-chat");

      chatButton.addEventListener("click", () => {
        chatWindow.classList.toggle("active");
      });

      closeChat.addEventListener("click", () => {
        chatWindow.classList.remove("active");
      });

      // Chat functionality
      const chatForm = document.getElementById("chat-form");
      const userInput = document.getElementById("user-input");
      const chatContainer = document.getElementById("chat-container");

      // Function to add messages to chat
      function addMessage(message, isUser = false) {
        const messageDiv = document.createElement("div");
        messageDiv.className = isUser
          ? "user-message chat-bubble rounded-lg p-3 mb-4 text-white shadow-md ml-auto"
          : "bot-message chat-bubble rounded-lg p-3 mb-4 text-white shadow-md";

        // For bot messages, parse markdown-like syntax
        if (!isUser) {
          // Simple markdown parsing for bold, code, and lists
          message = message
            .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
            .replace(/`(.*?)`/g, "<code>$1</code>")
            .replace(/^- (.*)/gm, "<li>$1</li>")
            .replace(/\n/g, "<br>");

          // Check if we have bullet points and wrap in ul if needed
          if (message.includes("<li>")) {
            message = message.replace(/<li>(.*?)<\/li>/g, "<li>$1</li>");
            message = `<ul>${message}</ul>`;
          }
        }

        messageDiv.innerHTML = `<p>${message}</p>`;
        chatContainer.appendChild(messageDiv);

        // Scroll to bottom
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // Function to show typing indicator
      function showTypingIndicator() {
        const typingDiv = document.createElement("div");
        typingDiv.id = "typing-indicator";
        typingDiv.className =
          "bot-message chat-bubble rounded-lg p-3 mb-4 text-white shadow-md";
        typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
        chatContainer.appendChild(typingDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      // Function to remove typing indicator
      function removeTypingIndicator() {
        const typingIndicator = document.getElementById("typing-indicator");
        if (typingIndicator) {
          typingIndicator.remove();
        }
      }

      // Function to get response from Gemini
      async function getGeminiResponse(userMessage) {
        try {
          // Add user message to history
          chatHistory.push({ role: "user", parts: [userMessage] });

          // Setup chat
          const chat = model.startChat({
            history: chatHistory,
            generationConfig: {
              maxOutputTokens: 1000,
            },
          });

          // Generate content
          const result = await chat.sendMessage(userMessage);
          const response = result.response.text();

          // Add response to history
          chatHistory.push({ role: "model", parts: [response] });

          return response;
        } catch (error) {
          console.error("Gemini API Error:", error);
          return "Sorry, I encountered an error. Please try again later.";
        }
      }

      // Fallback function in case API fails
      function getFallbackResponse(userMessage) {
        const normalizedMessage = userMessage.toLowerCase();

        // Basic fallback responses
        if (
          normalizedMessage.includes("hello") ||
          normalizedMessage.includes("hi")
        ) {
          return "Hello there! I'm currently operating in fallback mode. How can I help you?";
        } else if (normalizedMessage.includes("project")) {
          return "We have many projects in our Mini Projects Hub. What type of project are you looking for?";
        } else if (normalizedMessage.includes("help")) {
          return "I'm here to help with any questions about our Mini Projects Hub.";
        }

        return "I'm having trouble connecting to my AI service. Please try again later or ask a different question.";
      }

      // Handle form submission
      chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();

        if (message) {
          // Add user message
          addMessage(message, true);
          userInput.value = "";

          // Show typing indicator
          showTypingIndicator();

          try {
            // Get response from Gemini API
            const response = await getGeminiResponse(message);

            // Remove typing indicator and add bot response
            removeTypingIndicator();
            addMessage(response);
          } catch (error) {
            console.error("Error getting response:", error);

            // Use fallback response if API fails
            removeTypingIndicator();
            addMessage(getFallbackResponse(message));
          }
        }
      });
    </script>
  </body>
</html>
