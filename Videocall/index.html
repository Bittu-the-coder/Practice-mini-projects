<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Call with Whereby</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center"
  >
    <div class="container mx-auto p-6 max-w-4xl">
      <h1 class="text-4xl font-bold text-white text-center mb-6 drop-shadow-lg">
        Video Call Demo
      </h1>
      <!-- Container for the video call -->
      <div
        id="call-frame"
        class="w-full h-[500px] bg-white rounded-xl shadow-2xl overflow-hidden border-4 border-indigo-300"
      >
        <!-- Whereby iframe will be inserted here by JavaScript -->
      </div>
      <!-- Button to join the call -->
      <button
        onclick="joinCall()"
        class="mt-6 w-full py-3 px-6 bg-gradient-to-r from-green-400 to-blue-500 text-white font-semibold rounded-lg shadow-md hover:from-green-500 hover:to-blue-600 transition-all duration-300"
      >
        Join Call
      </button>
    </div>

    <script>
      // Replace this with your Whereby room URL
      const roomUrl =
        "https://gd-07.whereby.com/just-meeta9760573-83ec-4e0b-a6f7-54449e38b2a5?roomKey=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJtZWV0aW5nSWQiOiIxMDI0NDQwMDgiLCJyb29tUmVmZXJlbmNlIjp7InJvb21OYW1lIjoiL2p1c3QtbWVldGE5NzYwNTczLTgzZWMtNGUwYi1hNmY3LTU0NDQ5ZTM4YjJhNSIsIm9yZ2FuaXphdGlvbklkIjoiMzE1MTg4In0sImlzcyI6Imh0dHBzOi8vYWNjb3VudHMuc3J2LndoZXJlYnkuY29tIiwiaWF0IjoxNzQ3NzY4NzcxLCJyb29tS2V5VHlwZSI6Im1lZXRpbmdIb3N0In0.YwAE01kZ8FO_TKZ5PSqjbc1v-kDKX8uJVOw_gQyQeIg";

      // Function to join the call
      function joinCall() {
        try {
          // Get the container for the call frame
          const callFrameContainer = document.getElementById("call-frame");

          // Clear any existing content
          callFrameContainer.innerHTML = "";

          // Create an iframe for the Whereby room
          const iframe = document.createElement("iframe");
          iframe.src = roomUrl;
          iframe.allow =
            "camera; microphone; fullscreen; speaker; display-capture";
          iframe.style.width = "100%";
          iframe.style.height = "100%";
          iframe.style.border = "none";
          iframe.title = "Whereby Video Call";

          // Append the iframe to the container
          callFrameContainer.appendChild(iframe);

          console.log("Successfully joined the call!");
        } catch (error) {
          console.error("Error joining the call:", error);
        }
      }
    </script>
  </body>
</html>
