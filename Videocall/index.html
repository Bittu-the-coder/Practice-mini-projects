<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call with Daily.co</title>
    <!-- Include Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include Daily.js library -->
    <script src="https://unpkg.com/@daily-co/daily-js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center">
    <div class="container mx-auto p-6 max-w-4xl">
        <h1 class="text-4xl font-bold text-white text-center mb-6 drop-shadow-lg">
            Video Call Demo
        </h1>
        <!-- Iframe for the video call -->
        <div class="call-container w-full h-[500px] bg-white rounded-xl shadow-2xl overflow-hidden border-4 border-indigo-300">
            <iframe id="call-frame" allow="camera; microphone" title="Daily.co Video Call" class="w-full h-full"></iframe>
        </div>
        <!-- Button to join the call -->
        <button onclick="joinCall()" class="mt-6 w-full py-3 px-6 bg-gradient-to-r from-green-400 to-blue-500 text-white font-semibold rounded-lg shadow-md hover:from-green-500 hover:to-blue-600 transition-all duration-300">
            Join Call
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
